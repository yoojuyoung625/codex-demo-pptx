<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>네이버 트렌드 쿼리 자동 보고서</title>
<style>:root{--navy:#0b2036;--blue:#1769e0;--bg:#f2f6fb;--line:#dbe5ef;--muted:#6b7b8e;--red:#c63e46;--green:#138761}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#dff7f8,transparent 30rem),var(--bg);color:#172333;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}header{position:relative;padding:28px max(22px,calc((100vw - 1280px)/2));background:linear-gradient(120deg,var(--navy),#173d61);color:#fff}header small{color:#8fe2e8;font-weight:850}h1{margin:7px 0 3px;font-size:clamp(27px,4vw,42px)}header p{margin:0;color:#c7d6e5}.back-link{position:absolute;top:28px;right:max(22px,calc((100vw - 1280px)/2));display:inline-flex;align-items:center;min-height:39px;padding:0 15px;border:1px solid #ffffff55;border-radius:10px;background:#ffffff12;color:#fff;text-decoration:none;font-size:13px;font-weight:850}.back-link:hover{background:#ffffff22}.wrap{width:min(1280px,calc(100% - 30px));margin:20px auto}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 12px 35px #12284410;padding:20px;margin-bottom:16px}.toolbar,.tabs{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.toolbar{justify-content:space-between}.actions{display:flex;gap:8px;flex-wrap:wrap}button{min-height:39px;border:1px solid #cddae7;border-radius:10px;padding:0 16px;background:#fff;color:#32465c;font-weight:850;cursor:pointer}button.primary{border:0;background:linear-gradient(180deg,#237af0,#0755d7);color:#fff}button:disabled{opacity:.55;cursor:wait}.tabs{margin:15px 0}.tab.active{border-color:var(--blue);background:#eaf3ff;color:#125ac1}.status{color:var(--muted);font-size:12px}.status.error{color:var(--red)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:16px}.metric{padding:16px;border:1px solid var(--line);border-radius:13px;background:#fff}.metric span{color:var(--muted);font-size:11px;font-weight:800}.metric b{display:block;margin-top:5px;font-size:22px}.table-wrap{overflow:auto;max-height:68vh}table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}th,td{padding:10px;border-bottom:1px solid #e7edf4;text-align:right;white-space:nowrap}th{position:sticky;top:0;z-index:2;background:#f6f9fd;color:#53657a;font-size:10px}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1;font-weight:850}.brand{color:#a35418}.nonbrand{color:#08747d}.badge{display:inline-flex;padding:3px 7px;border-radius:999px;background:#e7f7ef;color:var(--green);font-size:10px;font-weight:900}.badge.fail{background:#feecee;color:var(--red)}.empty{text-align:center!important;padding:55px!important;color:var(--muted)}input{height:39px;border:1px solid #cddae7;border-radius:10px;padding:0 10px}@media(max-width:760px){header{padding-top:78px}.back-link{top:20px;left:22px;right:auto}.summary{grid-template-columns:1fr 1fr}}</style></head><body><header><a class="back-link" href="/">← 메인 대시보드로 돌아가기</a><small>NAVER SEARCH AD × NAVER API HUB</small><h1>네이버 키워드 트렌드 대시보드</h1><p>API 스냅샷으로 전일 예상 쿼리를 확정하고 과거 결과를 변경하지 않습니다.</p></header><main class="wrap">
<section class="panel"><div class="toolbar"><div><b>일일 수집 작업</b><div class="status" id="status">연결 상태를 확인 중입니다.</div></div><div class="actions"><input id="targetDate" type="date"><button id="retryBtn">실패 건 재시도</button><button class="primary" id="runBtn">전일 데이터 수집·확정</button></div></div><div class="tabs"><button class="tab active" data-view="daily">일별</button><button class="tab" data-view="weekly">주별</button><button class="tab" data-view="monthly">월별</button><button class="tab" data-view="jobs">작업 기록</button></div></section><section class="summary" id="summary"></section><section class="panel table-wrap"><table><thead id="head"></thead><tbody id="body"><tr><td class="empty">저장된 API 데이터가 없습니다.</td></tr></tbody></table></section></main>
<script>const $=s=>document.querySelector(s),fmt=new Intl.NumberFormat('ko-KR');let state={records:[],jobs:[],keywordConfig:{}},view='daily';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const iso=d=>d.toISOString().slice(0,10);const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);$('#targetDate').value=iso(yesterday);async function api(url,options){const r=await fetch(url,options);const data=await r.json();if(!r.ok)throw Error(data.error||'요청 실패');return data}async function load(){try{const [status,history]=await Promise.all([api('/api/status'),api('/api/history')]);state=history;$('#status').className='status';$('#status').textContent=`검색광고 ${status.searchAdConfigured?'연결':'미설정'} · DataLab ${status.datalabConfigured?'연결':'미설정'} · 확정 ${state.records.filter(r=>r.status==='FINAL').length}건`;render()}catch(e){showError(e)}}function showError(e){$('#status').className='status error';$('#status').textContent=e.message}async function run(path){const btns=[$('#runBtn'),$('#retryBtn')];btns.forEach(b=>b.disabled=true);$('#status').textContent='38개 키워드 API를 조회하고 있습니다…';try{const job=await api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({targetDate:$('#targetDate').value})});$('#status').textContent=`작업 ${job.status} · 확정 ${job.finalCount||0} · 실패 ${job.failedCount||0}`;await load()}catch(e){showError(e)}finally{btns.forEach(b=>b.disabled=false)}}$('#runBtn').onclick=()=>run('/api/jobs/daily');$('#retryBtn').onclick=()=>run('/api/jobs/retry');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render()});function weekStart(date){const d=new Date(date+'T12:00:00'),day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return iso(d)}function aggregate(unit){const map=new Map();for(const r of state.records.filter(r=>r.status==='FINAL')){let period=r.date;if(unit==='weekly')period=weekStart(r.date);if(unit==='monthly')period=r.date.slice(0,7);const key=`${r.type}|${r.keyword}|${period}`,x=map.get(key)||{type:r.type,keyword:r.keyword,period,value:0};x.value+=r.estimatedQuery;map.set(key,x)}return [...map.values()]}function render(){if(view==='jobs')return renderJobs();const rows=aggregate(view),periods=[...new Set(rows.map(r=>r.period))].sort();const keywords=[...(state.keywordConfig.nonbrand||[]).map(keyword=>({keyword,type:'nonbrand'})),...(state.keywordConfig.brand||[]).map(keyword=>({keyword,type:'brand'}))];const total=rows.reduce((s,r)=>s+r.value,0),failed=state.records.filter(r=>r.status==='FAILED').length;$('#summary').innerHTML=`<div class="metric"><span>관리 키워드</span><b>${keywords.length}개</b></div><div class="metric"><span>확정 레코드</span><b>${state.records.filter(r=>r.status==='FINAL').length}건</b></div><div class="metric"><span>표시 구간 합계</span><b>${fmt.format(total)}</b></div><div class="metric"><span>재시도 필요</span><b>${failed}건</b></div>`;$('#head').innerHTML=`<tr><th>키워드</th><th>구분</th>${periods.map(p=>`<th>${esc(p)}</th>`).join('')}<th>합계</th></tr>`;if(!periods.length){$('#body').innerHTML='<tr><td class="empty" colspan="4">전일 데이터 수집·확정을 실행하면 API 결과가 누적됩니다.</td></tr>';return}$('#body').innerHTML=keywords.map(k=>{const vals=periods.map(p=>rows.find(r=>r.keyword===k.keyword&&r.type===k.type&&r.period===p)?.value||0);return `<tr><td class="${k.type}">${esc(k.keyword)}</td><td>${k.type==='brand'?'브랜드':'비브랜드'}</td>${vals.map(v=>`<td>${fmt.format(v)}</td>`).join('')}<td><b>${fmt.format(vals.reduce((a,b)=>a+b,0))}</b></td></tr>`}).join('')}function renderJobs(){const jobs=[...state.jobs].reverse();$('#summary').innerHTML=`<div class="metric"><span>전체 작업</span><b>${jobs.length}건</b></div><div class="metric"><span>완료</span><b>${jobs.filter(j=>j.status==='FINAL').length}건</b></div><div class="metric"><span>부분 완료</span><b>${jobs.filter(j=>j.status==='PARTIAL').length}건</b></div><div class="metric"><span>실패</span><b>${jobs.filter(j=>j.status==='FAILED').length}건</b></div>`;$('#head').innerHTML='<tr><th>대상일</th><th>상태</th><th>요청</th><th>확정</th><th>실패</th><th>완료 시각</th><th>메시지</th></tr>';$('#body').innerHTML=jobs.length?jobs.map(j=>`<tr><td>${j.targetDate}</td><td><span class="badge ${j.status==='FAILED'?'fail':''}">${j.status}</span></td><td>${j.requested||0}</td><td>${j.finalCount||0}</td><td>${j.failedCount||0}</td><td>${j.finishedAt?new Date(j.finishedAt).toLocaleString('ko-KR'):'—'}</td><td>${esc(j.error||j.message||'')}</td></tr>`).join(''):'<tr><td class="empty" colspan="7">작업 기록이 없습니다.</td></tr>'}load();</script></body></html>
