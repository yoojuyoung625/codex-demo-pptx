<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>네이버 키워드 API 대시보드</title>
<style>
:root{--navy:#0b2036;--blue:#1769e0;--cyan:#18a9ba;--bg:#f2f6fb;--line:#dbe5ef;--muted:#6b7b8e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#dff7f8,transparent 30rem),var(--bg);color:#172333;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}header{padding:34px max(24px,calc((100vw - 1240px)/2));background:linear-gradient(120deg,var(--navy),#173d61);color:#fff}header small{color:#8fe2e8;font-weight:800}h1{margin:8px 0 4px;font-size:clamp(28px,4vw,46px)}header p{margin:0;color:#c7d6e5}.wrap{width:min(1240px,calc(100% - 32px));margin:24px auto}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 40px #12284412;padding:22px;margin-bottom:18px}.controls{display:grid;grid-template-columns:minmax(280px,1fr) 160px 160px auto;gap:12px;align-items:end}label{display:grid;gap:7px;color:#52657a;font-size:12px;font-weight:800}textarea,input{width:100%;border:1px solid #cfdbe8;border-radius:11px;padding:11px;background:#fbfdff}textarea{height:92px;resize:vertical}button{height:42px;border:0;border-radius:11px;padding:0 20px;background:linear-gradient(180deg,#237af0,#0755d7);color:#fff;font-weight:900;cursor:pointer}.status{margin-top:12px;color:var(--muted);font-size:12px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{padding:18px;border:1px solid var(--line);border-radius:14px;background:#fbfdff}.metric b{display:block;margin-top:5px;font-size:24px}.table-wrap{overflow:auto}table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}th,td{padding:12px;border-bottom:1px solid #e7edf4;text-align:right;white-space:nowrap}th{position:sticky;top:0;background:#f7fafe;color:#52657a;font-size:11px}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff;font-weight:800}.trend{display:flex;align-items:flex-end;justify-content:flex-end;gap:3px;height:36px;min-width:150px}.bar{width:8px;min-height:2px;background:linear-gradient(#20b9c8,#1769e0);border-radius:3px 3px 0 0}.empty{text-align:center;padding:50px;color:var(--muted)}.error{color:#c33}@media(max-width:800px){.controls{grid-template-columns:1fr 1fr}.controls label:first-child{grid-column:1/-1}.summary{grid-template-columns:1fr}}
</style></head><body><header><small>NAVER SEARCH AD × DATALAB</small><h1>키워드 API 대시보드</h1><p>최근 월간 검색량과 월별 상대 검색지수를 한 화면에서 확인합니다.</p></header><main class="wrap">
<section class="panel"><div class="controls"><label>키워드 (줄바꿈 또는 쉼표)<textarea id="keywords">자동차보험
자동차보험료계산
삼성화재다이렉트</textarea></label><label>시작일<input id="start" type="date"></label><label>종료일<input id="end" type="date"></label><button id="load">API 조회</button></div><div class="status" id="status">서버의 .env에 네이버 API 인증정보를 설정한 뒤 조회하세요.</div><div class="status">산식: 일별 예상 쿼리 = 검색광고 PC+MO 월간검색수 × 해당 일 DataLab 지수 ÷ 30일 지수 합계</div></section>
<section class="summary" id="summary"></section><section class="panel table-wrap"><table><thead id="head"></thead><tbody id="body"><tr><td class="empty">조회 전입니다.</td></tr></tbody></table></section></main>
<script>
const $=s=>document.querySelector(s),fmt=new Intl.NumberFormat('ko-KR');const now=new Date(),start=new Date(now);start.setDate(start.getDate()-29);$('#end').value=now.toISOString().slice(0,10);$('#start').value=start.toISOString().slice(0,10);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('#load').onclick=async()=>{const keywords=$('#keywords').value.split(/[\n,]/).map(v=>v.trim()).filter(Boolean);$('#load').disabled=true;$('#status').className='status';$('#status').textContent='두 네이버 API를 조회하고 있습니다…';try{const r=await fetch('/api/dashboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keywords,startDate:$('#start').value,endDate:$('#end').value})});const data=await r.json();if(!r.ok)throw Error(data.error||'조회 실패');render(data);$('#status').textContent=`${data.rows.length}개 키워드 · ${new Date(data.generatedAt).toLocaleString('ko-KR')} 갱신`;}catch(e){$('#status').className='status error';$('#status').textContent=e.message;}finally{$('#load').disabled=false}};
function render(data){const periods=[...new Set(data.rows.flatMap(r=>r.trend.map(v=>v.period)))].sort();const total=data.rows.reduce((s,r)=>s+(r.searchAd?.monthlyTotal||0),0);const dayLabel=d=>d.slice(5).replace('-','.');$('#summary').innerHTML=`<div class="metric">조회 키워드<b>${data.rows.length}개</b></div><div class="metric">30일 월간검색수 합계<b>${fmt.format(total)}</b></div><div class="metric">배분 기준<b>DataLab 일별 통합지수</b></div>`;$('#head').innerHTML=`<tr><th>키워드</th><th>PC 월간</th><th>모바일 월간</th><th>PC+MO 기준</th><th>경쟁</th>${periods.map(d=>`<th>${dayLabel(d)}<br>예상 쿼리</th>`).join('')}</tr>`;$('#body').innerHTML=data.rows.map(r=>`<tr><td>${esc(r.keyword)}</td><td>${r.searchAd?fmt.format(r.searchAd.monthlyPc):'—'}</td><td>${r.searchAd?fmt.format(r.searchAd.monthlyMobile):'—'}</td><td>${r.searchAd?fmt.format(r.searchAd.monthlyTotal):'—'}</td><td>${esc(r.searchAd?.competition||'—')}</td>${periods.map(d=>{const v=r.trend.find(x=>x.period===d);return `<td title="DataLab 지수 ${v?.ratio?.toFixed(2)??'—'} · 배분율 ${v?(v.allocationRate*100).toFixed(2):'—'}%">${v?fmt.format(v.estimatedQuery):'—'}</td>`}).join('')}</tr>`).join('')}
</script></body></html>
